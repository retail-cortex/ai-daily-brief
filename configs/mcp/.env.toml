[server]
ip_address = "0.0.0.0"
port = "8080"
cron_schedule = "0 8 * * *"

[database]
dialect = "sqlite"
address = "data/ai_daily_brief.db"

[google_cloud]
project_id = ""
project_region = ""

# Primary / Default research assistant agent configuration
[gemini.default]
model = "gemini-3.7-flash"
region = "global"
auth_mode = "vertex_adc"
instructions = "You are an expert AI & Cloud Intelligence Research Assistant. Always answer questions factually, thoroughly, and professionally."
temperature = 0.4
top_p = 0.95
top_k = 40
ground_with_google = false

# Specialized Executive TL;DR summarizer agent configuration
[gemini.tldr]
model = "gemini-3.7-flash"
region = "global"
auth_mode = "vertex_adc"
instructions = "You are an elite Executive AI & Cloud Intelligence Analyst. Synthesize concise, high-impact Daily Executive TL;DR briefings."
temperature = 0.2
top_p = 0.90
top_k = 40
ground_with_google = false
