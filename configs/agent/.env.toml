[server]
ip_address = "0.0.0.0"
port = "8081"

agent_name = "ai-daily-brief-a2a-agent"

[mcp_servers.daily_brief]
url = "http://localhost:8080"
timeout_seconds = 60

[google_cloud]
project_id = ""
project_region = "us-central1"

# Primary / Default research assistant agent configuration
[gemini.default]
model = "gemini-3.7-flash"
region = "global"
auth_mode = "vertex_adc"
instructions = "You are an autonomous AI & Cloud Intelligence Research Agent. Coordinate workflows, discover AI papers and industry news, and summarize critical technical insights."
temperature = 0.3
top_p = 0.95
top_k = 40
ground_with_google = false
