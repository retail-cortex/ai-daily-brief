name: Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/coverage.svg"
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bazel Setup
        uses: bazelbuild/setup-bazelisk@v3

      - name: Mount bazel cache
        uses: actions/cache@v4
        with:
          path: "/home/runner/.cache/bazel"
          key: bazel-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            bazel-${{ runner.os }}-

      - name: "Build Workspace"
        run: bazel build //...

  release:
    name: Release
    runs-on: macos-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Bazel Setup
        uses: bazelbuild/setup-bazelisk@v3

      - name: Install Packaging Utilities
        run: brew install create-dmg nsis

      - name: Create Release Directory
        run: mkdir release

      - name: Build and Package for Linux (x86_64 tarball & debian package)
        run: |
          bazel build //cmd/ai-daily-brief:pkg_linux_amd64 //cmd/ai-daily-brief:pkg_deb
          cp $(bazel cquery //cmd/ai-daily-brief:pkg_linux_amd64 --output=files) release/
          cp $(bazel cquery //cmd/ai-daily-brief:pkg_deb --output=files) release/

      - name: Build and Package for macOS (Intel x86_64 tarball)
        run: |
          bazel build //cmd/ai-daily-brief:pkg_darwin_amd64
          cp $(bazel cquery //cmd/ai-daily-brief:pkg_darwin_amd64 --output=files) release/

      - name: Build and Package for macOS (ARM64 tarball & DMG Installer)
        run: |
          # Build default tarball and binary
          bazel build //cmd/ai-daily-brief:pkg_darwin_arm64 //cmd/ai-daily-brief:ai_daily_brief_darwin_arm64
          cp $(bazel cquery //cmd/ai-daily-brief:pkg_darwin_arm64 --output=files) release/

          # Construct proper macOS App Bundle
          mkdir -p release/AI-Daily-Brief.app/Contents/MacOS
          mkdir -p release/AI-Daily-Brief.app/Contents/Resources
          BIN_PATH=$(bazel cquery //cmd/ai-daily-brief:ai_daily_brief_darwin_arm64 --output=files)
          cp "$BIN_PATH" release/AI-Daily-Brief.app/Contents/MacOS/ai-daily-brief
          chmod +x release/AI-Daily-Brief.app/Contents/MacOS/ai-daily-brief
          cp build/darwin/Info.plist release/AI-Daily-Brief.app/Contents/
          cp build/darwin/AppIcon.icns release/AI-Daily-Brief.app/Contents/Resources/
          echo -n "APPL????" > release/AI-Daily-Brief.app/Contents/PkgInfo

          # Ad-hoc code sign the bundle to satisfy macOS Gatekeeper
          codesign --force --deep --sign - "release/AI-Daily-Brief.app"

          # Prepare DMG source folder with app and first-time launch helper
          mkdir -p release/dmg_root
          mv release/AI-Daily-Brief.app release/dmg_root/
          cp build/darwin/Open_First_Time.command release/dmg_root/
          chmod +x release/dmg_root/Open_First_Time.command

          # Wrap into a styled draggable DMG with volume icon
          create-dmg \
            --volname "AI Daily Brief Installation" \
            --volicon "build/darwin/AppIcon.icns" \
            --window-pos 200 120 \
            --window-size 580 400 \
            --icon-size 100 \
            --icon "AI-Daily-Brief.app" 140 140 \
            --app-drop-link 440 140 \
            --icon "Open_First_Time.command" 290 270 \
            --hide-extension "AI-Daily-Brief.app" \
            release/ai-daily-brief-darwin-arm64.dmg \
            release/dmg_root/
          rm -rf release/dmg_root

      - name: Build and Package for Windows (x86_64 zip & EXE Installer)
        run: |
          # Build default zip and binary
          bazel build //cmd/ai-daily-brief:pkg_windows_amd64 //cmd/ai-daily-brief:ai_daily_brief_windows_amd64
          cp $(bazel cquery //cmd/ai-daily-brief:pkg_windows_amd64 --output=files) release/

          # Build NSIS Setup Wizard
          WIN_BIN_PATH=$(bazel cquery //cmd/ai-daily-brief:ai_daily_brief_windows_amd64 --output=files)
          cd build/windows
          makensis -D"BIN_NAME=../../$WIN_BIN_PATH" installer.nsi
          cp ai-daily-brief-setup.exe ../../release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "release-${{ github.sha }}"
          files: |
            release/*.tar.gz
            release/*.zip
            release/*.deb
            release/*.dmg
            release/*.exe
          generate_release_notes: true
